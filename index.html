    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #222;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        input, textarea, [contenteditable] { -webkit-user-select: text; user-select: text; }
        img { -webkit-user-drag: none; }
        #world3d {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
            touch-action: none;
        }
        /* Шрифт интерфейса Rubble Lab: Rubik (SIL OFL 1.1, кириллица), лицензия — assets/licenses/fonts_rubik/OFL.txt.
           @font-face здесь, чтобы экран загрузки рисовался им до запуска скриптов; GameHud.js берёт тот же 'Rubik'. */
        @font-face { font-family: 'Rubik'; src: url('assets/fonts/rubik.ttf?v=0.1.1-a1690e60') format('truetype'); font-weight: 300 900; font-style: normal; font-display: swap; }
        /* Экран загрузки: «лабораторный стенд» — графитовый фон с чертёжной сеткой, полосы опасности, сегментный (воксельный) индикатор. */
        #loading-screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: clamp(8px, 2.4vh, 18px);
            padding: 20px 16px;
            box-sizing: border-box;
            overflow: hidden;
            background:
                radial-gradient(ellipse at 50% 42%, rgba(255, 198, 26, .09), transparent 62%),
                linear-gradient(rgba(255, 198, 26, .05) 1px, transparent 1px) 0 0 / 44px 44px,
                linear-gradient(90deg, rgba(255, 198, 26, .05) 1px, transparent 1px) 0 0 / 44px 44px,
                #15171a;
            font-family: 'Rubik', 'Arial Narrow', 'Segoe UI', system-ui, sans-serif;
            z-index: 1000;
        }
        #loading-screen::before, #loading-screen::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            height: 14px;
            background: repeating-linear-gradient(-45deg, #ffc61a 0 12px, #15171a 12px 24px);
        }
        #loading-screen::before { top: 0; }
        #loading-screen::after { bottom: 0; }
        .loading-mark { width: clamp(72px, 19vh, 150px); height: auto; flex: none; animation: ld-bob 1.2s steps(3) infinite; }
        @keyframes ld-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
        .loading-text {
            font: 600 clamp(11px, 1.9vh, 14px)/1.2 'Rubik', 'Arial Narrow', system-ui, sans-serif;
            letter-spacing: .16em;
            text-transform: uppercase;
            color: #9aa1ab;
            text-align: center;
            min-height: 1.2em;
        }
        .loading-bar {
            width: min(360px, 78vw);
            height: 24px;
            padding: 3px;
            box-sizing: border-box;
            background: #0c0d0f;
            border: 3px solid #f2ecdb;
            border-radius: 3px;
            box-shadow: 4px 4px 0 rgba(0, 0, 0, .55);
            overflow: hidden;
        }
        .loading-progress {
            height: 100%;
            width: 0%;
            background: repeating-linear-gradient(-45deg, #ffc61a 0 8px, #d29a00 8px 16px);
            background-size: 22.63px 100%;
            -webkit-mask-image: repeating-linear-gradient(90deg, #000 0 14px, transparent 14px 17px);
            mask-image: repeating-linear-gradient(90deg, #000 0 14px, transparent 14px 17px);
            transition: width 0.3s ease;
            animation: ld-stripes .7s linear infinite;
        }
        @keyframes ld-stripes { to { background-position: 22.63px 0; } }
        #loading-title {
            margin: 0;
            font: 900 clamp(26px, 6.4vw, 54px)/1.05 'Rubik', 'Arial Narrow', system-ui, sans-serif;
            letter-spacing: .09em;
            text-transform: uppercase;
            color: #f2ecdb;
            text-shadow: 3px 3px 0 #ffc61a, 5px 5px 0 rgba(0, 0, 0, .55);
            text-align: center;
            max-width: 90vw;
            overflow-wrap: anywhere;
        }
        #loading-percent { font: 800 clamp(18px, 3.6vh, 28px)/1 'Rubik', system-ui, sans-serif; letter-spacing: .08em; font-variant-numeric: tabular-nums; color: #ffc61a; }
        #loading-retry { padding: 13px 26px; border: 0; border-radius: 4px; background: #ffc61a; color: #15171a; font: 800 16px/1 'Rubik', system-ui, sans-serif; letter-spacing: .06em; text-transform: uppercase; box-shadow: 0 5px 0 #a97c00, 0 7px 0 rgba(0, 0, 0, .5); cursor: pointer; }
        #loading-retry:active { transform: translateY(4px); box-shadow: 0 1px 0 #a97c00; }
        @media (prefers-reduced-motion: reduce) { .loading-mark, .loading-progress { animation: none; } }
    </style>
</head>

    <script>
        // Игровая область: долгий тап и ПКМ не открывают меню браузера, картинки не
        // тянутся, текст не выделяется — кроме настоящих полей ввода.
        (() => {
            const isField = t => t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable);
            for (const type of ['contextmenu', 'dragstart', 'selectstart']) {
                document.addEventListener(type, e => { if (!isField(e.target)) e.preventDefault(); });
            }
        })();
    </script>
